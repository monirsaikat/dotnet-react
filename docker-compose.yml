services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-assignment_management}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Host=database;Port=5432;Database=${POSTGRES_DB:-assignment_management};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-local-development-only}
      Jwt__Key: ${JWT_KEY:-local-development-jwt-key-change-before-production-12345}
      Jwt__Issuer: AssignmentManagementApi
      Jwt__Audience: AssignmentManagementClient
      Database__ApplyMigrationsOnStartup: "true"
      Frontend__Url: http://localhost:3000
    ports:
      - "5167:8080"
    depends_on:
      database:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:5167/api}
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:5167/api}
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres-data:
